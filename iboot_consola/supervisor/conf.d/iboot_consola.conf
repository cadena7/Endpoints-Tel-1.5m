[program:iboot_consola]
directory = /opt/telescope/iboot_consola
command = python3 iboot_consola.py
user = control
autostart = yes
autorestart = true
stopasgroup = true
startretries = 3
stderr_logfile = /var/log/iboot_consola.err.log
stdout_logfile = /var/log/iboot_consola.out.log
stderr_logfile_maxbytes = 1MB
stdout_logfile_maxbytes = 1MB
