[program:iboot_rack]
directory = /opt/telescope/iboot_rack
command = python3 iboot_rack.py
user = control
autostart = yes
autorestart = true
stopasgroup = true
startretries = 3
stderr_logfile = /var/log/iboot_rack.err.log
stdout_logfile = /var/log/iboot_rack.out.log
stderr_logfile_maxbytes = 1MB
stdout_logfile_maxbytes = 1MB

