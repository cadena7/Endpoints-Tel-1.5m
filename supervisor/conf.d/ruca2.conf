[program:ruca2]
directory = /opt/telescope/Ruca2
command = python3 Ruca2_mqtt.py
user = control
autostart = yes
autorestart = true
stopasgroup = true
startretries = 3
stderr_logfile = /var/log/Ruca2_mqtt.err.log
stdout_logfile = /var/log/Ruca2_mqtt.out.log
stderr_logfile_maxbytes = 1MB
stdout_logfile_maxbytes = 1MB

