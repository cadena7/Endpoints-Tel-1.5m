[program:inclinometro_endpoint]
directory = /opt/telescope/Inclinometro_endpoint
command = python3 inclinometro_endpoint.py
user = control
autostart = yes
autorestart = true
stopasgroup = true
startretries = 3
stderr_logfile = /var/log/inclinometro_endpoint.err.log
stdout_logfile = /var/log/inclinometro_endpoint.out.log
stderr_logfile_maxbytes = 1MB
stdout_logfile_maxbytes = 1MB

