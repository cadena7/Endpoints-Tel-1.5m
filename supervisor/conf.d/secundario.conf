[program:secundario]
directory = /opt/telescope/Secundario_endpoint/
command = python3 sec_main.py
user = control
autostart = yes
autorestart = true
stopasgroup = true
startretries = 3
stderr_logfile = /var/log/secundario.err.log
stdout_logfile = /var/log/secundario.out.log
stderr_logfile_maxbytes = 2MB
stdout_logfile_maxbytes = 2MB

